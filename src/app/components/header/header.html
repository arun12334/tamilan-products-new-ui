<div class="c324700-SHARED-998412-promo-bar">
  <div class="container-xl d-flex justify-content-between align-items-center gap-3">
    <span>🎁 100% secure online payment, COD Not Available</span>
    <span class="c324700-SHARED-998412-promo-center"><i class="bi bi-fire"></i> FREE SHIPPING AVAILABLE on Orders Above ₹999/-</span>
    <span class="c324700-SHARED-998412-socials" aria-label="Social media"><i class="bi bi-facebook"></i><i class="bi bi-instagram"></i><i class="bi bi-youtube"></i><i class="bi bi-pinterest"></i></span>
  </div>
</div>

<header class="c324700-SHARED-998412-site-header">
  <div class="container-xl">
    <div class="c324700-SHARED-998412-header-main">
      <a class="c324700-SHARED-998412-brand" routerLink="/" aria-label="Tamilan Products home">
        <span class="c324700-SHARED-998412-brand-mark"><i class="bi bi-flower1"></i></span>
        <span class="c324700-SHARED-998412-brand-copy"><strong>TAMILAN</strong><small>PRODUCTS</small></span>
      </a>
      <form class="c324700-SHARED-998412-search-form" (ngSubmit)="search()">
        <input type="search" name="search" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" placeholder="I'm looking for..." aria-label="Search products">
        <button type="submit"><i class="bi bi-search"></i><span>Search</span></button>
      </form>
      <div class="c324700-SHARED-998412-header-tools">
        <a class="c324700-SHARED-998412-help-link" routerLink="/contact"><i class="bi bi-telephone"></i><span><b>+91 96885 26199</b><small>Need Any Help?</small></span></a>
        <a routerLink="/account" class="c324700-SHARED-998412-tool-link"><i class="bi bi-person"></i><span>Log In<strong>Account</strong></span></a>
        <a class="c324700-SHARED-998412-icon-tool" routerLink="/wishlist" aria-label="Wishlist"><i class="bi bi-heart"></i><em>{{ store.wishlistCount() }}</em></a>
        <button class="c324700-SHARED-998412-cart-shortcut" type="button" (click)="store.openCart()" [attr.aria-expanded]="store.cartDrawerOpen()"><span class="c324700-SHARED-998412-cart-icon"><i class="bi bi-cart3"></i><em>{{ store.cartCount() }}</em></span><span>Cart<strong>{{ store.cartTotal() | currency:'INR':'symbol':'1.2-2' }}</strong></span></button>
        <button class="c324700-SHARED-998412-mobile-menu-btn" type="button" (click)="mobileMenuOpen.update(open => !open)" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="main-navigation" [attr.aria-label]="mobileMenuOpen() ? 'Close navigation' : 'Open navigation'"><i [class]="mobileMenuOpen() ? 'bi bi-x-lg' : 'bi bi-list'"></i></button>
      </div>
    </div>
    <nav id="main-navigation" class="c324700-SHARED-998412-main-nav" [class.c324700-SHARED-998412-mobile-open]="mobileMenuOpen()" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="c324700-SHARED-998412-active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Dashboard</a>
      @for (item of menuItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="c324700-SHARED-998412-active" ariaCurrentWhenActive="page" (click)="closeMobileMenu()">{{ item.name }}</a>
      }
    </nav>
  </div>
</header>
